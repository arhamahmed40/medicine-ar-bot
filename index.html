<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AR Marker Diagnostic</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151515;font-family:Arial,sans-serif}#panel{position:fixed;z-index:9999;top:10px;left:10px;right:10px;background:#101c2ce8;color:#fff;padding:12px;border-radius:10px;font-size:14px;line-height:1.5;pointer-events:none}#state{font-weight:bold;color:#ffd56c}#events{font-size:12px;color:#c9d8e6}a-scene{position:absolute;inset:0}</style></head><body><div id="panel"><div>AR diagnostic v2 | <span id="state">Starting...</span></div><div id="events">Waiting for camera and marker events</div><div>Point camera at the complete Hiro marker. A red cube should sit on it.</div></div><a-scene embedded vr-mode-ui="enabled:false" arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" renderer="antialias: true; alpha: true"><a-marker id="hiro" preset="hiro" emitevents="true"><a-box position="0 0.25 0" width="0.5" height="0.5" depth="0.5" color="red" material="shader: flat"></a-box><a-plane position="0 0.005 0" rotation="-90 0 0" width="0.8" height="0.8" color="yellow" material="shader: flat; side: double"></a-plane></a-marker><a-entity camera></a-entity></a-scene><script>const state=document.getElementById('state'),events=document.getElementById('events'),marker=document.getElementById('hiro'),scene=document.querySelector('a-scene');let found=0,lost=0;function report(s){state.textContent=s;events.textContent='Found: '+found+' | Lost: '+lost+' | '+new Date().toLocaleTimeString()}marker.addEventListener('markerFound',()=>{found++;report('MARKER DETECTED')});marker.addEventListener('markerLost',()=>{lost++;report('Marker lost')});scene.addEventListener('loaded',()=>report('Scene loaded; waiting for camera/marker'));scene.addEventListener('camera-init',()=>report('Camera initialized; searching for Hiro'));scene.addEventListener('camera-error',e=>report('CAMERA ERROR: '+(e.detail?.message||'check permissions')));window.addEventListener('error',e=>{events.textContent='JS error: '+e.message});</script></body></html>
